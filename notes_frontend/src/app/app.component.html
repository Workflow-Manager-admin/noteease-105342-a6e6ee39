<div class="app-wrapper">
  <app-sidebar
    [notes]="notes"
    [selectedNoteId]="selectedNoteId"
    [loading]="loading"
    (create)="handleCreate()"
    (select)="handleSelect($event)"
    (search)="handleSearch($event)"
  ></app-sidebar>
  <app-notes-main
    [notes]="notes"
    [selectedNoteId]="selectedNoteId"
    [loading]="loading"
    (save)="handleSave($event)"
    (delete)="handleDelete($event)"
    (create)="handleCreate()"
    (select)="handleSelect($event)"
  ></app-notes-main>
</div>
